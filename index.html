<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starlinks API</title>
    <meta name="description" content="Starlinks API for distributors: smart links, pre-saves, promo images, analytics and webhooks." />
    <!-- Shared privately with distributors: keep it out of search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="https://www.starmakersdistro.com/images/smartlinks/powered-by-logo.png" />
    <style>
      body { margin: 0; background: #0e0e12; }
      /* Comparison tables: keep the row labels whole. */
      table th:first-child, table td:first-child { white-space: nowrap; }
      /* Star Makers colours on Scalar's dark theme. */
      .dark-mode {
        --scalar-background-1: #0e0e12;
        --scalar-background-2: #16161c;
        --scalar-background-3: #1e1e26;
        --scalar-color-accent: #ffd400;
        --scalar-button-1: #ffd400;
        --scalar-button-1-color: #0a0a0a;
        --scalar-button-1-hover: #ffe24d;
      }
    </style>
  </head>
  <body>
    <script
      id="api-reference"
      data-url="./openapi.json"
      data-configuration='{"theme":"default","darkMode":true,"forceDarkModeState":"dark","hideDarkModeToggle":true,"layout":"modern","hideModels":false,"defaultHttpClient":{"targetKey":"shell","clientKey":"curl"},"metaData":{"title":"Starlinks API"},"showDeveloperTools":"never","agent":{"disabled":true},"mcp":{"disabled":true}}'
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.4/dist/browser/standalone.js"></script>
  </body>
</html>
